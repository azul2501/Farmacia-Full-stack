# Despliegue en un servidor propio (VPS) con HTTPS automatico via Caddy.
# Uso: cp .env.production.example .env  (y completar)  &&  docker compose -f compose.prod.yml up -d --build
# Solo Caddy expone puertos (80/443); db, redis, api y web quedan en la red interna.

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN es obligatorio}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN es obligatorio}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL es obligatorio}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boticas}
      POSTGRES_USER: ${POSTGRES_USER:-boticas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boticas_user} -d ${POSTGRES_DB:-boticas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --access-logfile -"
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY es obligatorio}
      DJANGO_DEBUG: "false"
      DJANGO_HTTPS: "true"
      DJANGO_ALLOWED_HOSTS: ${API_DOMAIN},api,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://${API_DOMAIN},https://${APP_DOMAIN}
      DATABASE_URL: postgresql://${POSTGRES_USER:-boticas_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-boticas}
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
      CORS_ALLOW_CREDENTIALS: "true"
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-boticas_refresh}
      JWT_COOKIE_SECURE: "true"
      JWT_COOKIE_SAMESITE: Lax
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:?JWT_COOKIE_DOMAIN es obligatorio (ej. .midominio.com)}
      USE_S3: ${USE_S3:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency ${CELERY_CONCURRENCY:-2}
    healthcheck:
      disable: true
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DATA_SOURCE: api
        NEXT_PUBLIC_API_BASE_URL: https://${API_DOMAIN}/api/v1
        NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: "false"
        NEXT_PUBLIC_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-boticas_refresh}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  media:
