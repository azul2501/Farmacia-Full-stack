# Desarrollo local: docker compose up -d --build
# Servicios opcionales (perfiles): s3 (MinIO), worker (Celery, sin tareas en la V1), jobs (alertas DIGEMID) y tests.
#   docker compose --profile worker up -d
#   docker compose run --rm tests        -> corre la suite de pytest con config.settings.test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boticas}
      POSTGRES_USER: ${POSTGRES_USER:-boticas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boticas_local_password}
    volumes:
      - boticas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boticas_user} -d ${POSTGRES_DB:-boticas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - boticas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento S3 local opcional: docker compose --profile s3 up (y USE_S3=true).
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-boticas_local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-boticas_local_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - boticas_minio_data:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    profiles: ["s3"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-boticas_local} ${AWS_SECRET_ACCESS_KEY:-boticas_local_secret}; do sleep 2; done;
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-boticas-local};
      exit 0;"

  # Consulta gratuita de RUC en SUNAT para el registro de boticas (fase 3).
  # Si no responde, el registro sigue y la botica queda "RUC por verificar" en el admin.
  ruc:
    image: ${RUC_IMAGE:-giansalex/peru-consult-api:latest}
    environment:
      API_TOKEN: ${RUC_API_TOKEN:-local-ruc-token}

  api:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py load_base_catalog --if-empty && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      # Version publicada del producto (1, 2 o 3). Debe coincidir con NEXT_PUBLIC_APP_VERSION del frontend.
      APP_VERSION: ${APP_VERSION:-1}
      RUC_LOOKUP_URL: ${RUC_LOOKUP_URL:-http://ruc:8080/api/v1/ruc/{ruc}?token=${RUC_API_TOKEN:-local-ruc-token}}
      SIGNUP_THROTTLE_RATE: ${SIGNUP_THROTTLE_RATE:-5/hour}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-only-change-before-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # Compose local corre la imagen de produccion sobre http; en un servidor real usar true.
      DJANGO_HTTPS: ${DJANGO_HTTPS:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DATABASE_URL: ${DATABASE_URL:-postgresql://boticas_user:boticas_local_password@db:5432/boticas}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      JWT_REFRESH_COOKIE_NAME: ${JWT_REFRESH_COOKIE_NAME:-boticas_refresh}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAMESITE: ${JWT_COOKIE_SAMESITE:-Lax}
      JWT_COOKIE_DOMAIN: ${JWT_COOKIE_DOMAIN:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      USE_S3: ${USE_S3:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-boticas_local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-boticas_local_secret}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-boticas-local}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
    ports:
      - "8000:8000"
    volumes:
      - boticas_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    profiles: ["worker"]
    command: celery -A config worker -l INFO
    healthcheck:
      disable: true
    environment: *backend_environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Descarga una vez al día las alertas sanitarias nuevas de DIGEMID: docker compose --profile jobs up -d
  digemid-sync:
    build: ./backend
    profiles: ["jobs"]
    command: sh -c "while true; do python manage.py sync_digemid_alerts || true; sleep 86400; done"
    healthcheck:
      disable: true
    environment: *backend_environment
    depends_on:
      api:
        condition: service_healthy

  # Suite de pruebas del backend (SQLite en memoria, no toca la base de datos de db).
  tests:
    build: ./backend
    profiles: ["tests"]
    user: root
    command: sh -c "pip install -q -r requirements-dev.txt && pytest"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test

volumes:
  boticas_postgres_data:
  boticas_redis_data:
  boticas_minio_data:
  boticas_media:
