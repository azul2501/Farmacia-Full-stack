      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        legal_name:
          type: string
          maxLength: 200
        trade_name:
