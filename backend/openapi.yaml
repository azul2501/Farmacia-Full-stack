components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AccountStatusEnum:
      enum:
      - PENDING
      - PARTIAL
      - PAID
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pendiente
        * `PARTIAL` - Parcial
        * `PAID` - Pagada
        * `CANCELLED` - Anulada
    ActiveIngredient:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        is_active:
          type: boolean
      required:
      - id
      - name
    AuditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        action:
          type: string
          readOnly: true
        resource_type:
          type: string
          readOnly: true
        resource_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        payload:
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        branch:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: integer
          readOnly: true
          nullable: true
      required:
      - action
      - actor
      - actor_name
      - branch
      - created_at
      - id
      - ip_address
      - payload
      - resource_id
      - resource_type
      - updated_at
    BasicSalesReport:
      type: object
      properties:
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
        count:
          type: integer
        byDay:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - byDay
      - count
      - total
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 250
        is_active:
          type: boolean
        phone:
          type: string
          maxLength: 30
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - code
      - created_at
      - id
      - name
      - updated_at
    BranchSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 160
        address:
          type: string
          maxLength: 250
        is_active:
          type: boolean
      required:
      - address
      - code
      - id
      - name
    CashMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        performed_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        movement_type:
          allOf:
          - $ref: '#/components/schemas/CashMovementMovementTypeEnum'
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        reference_type:
          type: string
          readOnly: true
        reference_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        session:
          type: string
          format: uuid
          readOnly: true
        performed_by:
          type: integer
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - movement_type
      - performed_by
      - performed_by_name
      - reason
      - reference_id
      - reference_type
      - session
      - updated_at
    CashMovementMovementTypeEnum:
      enum:
      - OPENING
      - CASH_SALE
      - MANUAL_IN
      - WITHDRAWAL
      - REFUND
      - RECEIVABLE_COLLECTION
      - PAYABLE_PAYMENT
      - EXPENSE
      - ADDITIONAL_INCOME
      - CONTRIBUTION
      type: string
      description: |-
        * `OPENING` - Apertura
        * `CASH_SALE` - Venta en efectivo
        * `MANUAL_IN` - Ingreso manual
        * `WITHDRAWAL` - Retiro
        * `REFUND` - Devolucion
        * `RECEIVABLE_COLLECTION` - Cobro de cuenta
        * `PAYABLE_PAYMENT` - Pago de cuenta
        * `EXPENSE` - Gasto
        * `ADDITIONAL_INCOME` - Ingreso adicional
        * `CONTRIBUTION` - Aporte de caja
    CashRegister:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
        branch:
          type: string
          format: uuid
      required:
      - branch
      - branch_name
      - code
      - created_at
      - id
      - name
      - updated_at
    CashSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        register_name:
          type: string
          readOnly: true
        opened_by_name:
          type: string
          readOnly: true
        movements:
          type: array
          items:
            $ref: '#/components/schemas/CashMovement'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CashSessionStatusEnum'
          readOnly: true
        opening_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        expected_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        counted_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        difference:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        opened_at:
          type: string
          format: date-time
          readOnly: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          readOnly: true
        register:
          type: string
          format: uuid
          readOnly: true
        opened_by:
          type: integer
          readOnly: true
        closed_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - closed_at
      - closed_by
      - counted_cash
      - created_at
      - difference
      - expected_cash
      - id
      - movements
      - notes
      - opened_at
      - opened_by
      - opened_by_name
      - opening_amount
      - register
      - register_name
      - status
      - updated_at
    CashSessionStatusEnum:
      enum:
      - OPEN
      - CLOSING
      - CLOSED
      - CLOSED_WITH_DIFFERENCE
      type: string
      description: |-
        * `OPEN` - Abierta
        * `CLOSING` - En cierre
        * `CLOSED` - Cerrada
        * `CLOSED_WITH_DIFFERENCE` - Cerrada con diferencia
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 160
        is_active:
          type: boolean
      required:
      - id
      - name
    CategoryTypeEnum:
      enum:
      - EXPENSE
      - INCOME
      type: string
      description: |-
        * `EXPENSE` - Gasto
        * `INCOME` - Ingreso
    ChangeOwnPassword:
