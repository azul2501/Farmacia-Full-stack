      - in: query
        name: register
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CLOSED
          - CLOSED_WITH_DIFFERENCE
          - CLOSING
          - OPEN
        description: |-
          * `OPEN` - Abierta
          * `CLOSING` - En cierre
