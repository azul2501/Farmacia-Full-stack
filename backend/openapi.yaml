          application/json:
            schema:
              $ref: '#/components/schemas/ActiveIngredient'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveIngredient'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActiveIngredient'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveIngredient'
          description: ''
  /api/v1/active-ingredients/{id}/:
