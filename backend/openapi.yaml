    post:
      operationId: api_v1_auth_login_create
      description: Inicia sesión y guarda el refresh token en una cookie HttpOnly.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: api_v1_auth_logout_create
      description: Invalida el refresh token y elimina su cookie.
      tags:
      - api
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password/change/:
